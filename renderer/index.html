<body>
<div class="md" id="md" data-mode="split">
  <header class="titlebar">
    <div class="titlebar__left" role="group" aria-label="Sidebar">
      <button class="tbtn" data-act="toggle-left" aria-label="Toggle left sidebar" title="Toggle left sidebar"><i data-lucide="panel-left" class="ic"></i></button>
    </div>
    <div class="titlebar__center">
      <div class="doc-title-wrap"><span class="appname"><b>Laurevine</b> Loto</span><span class="sep" aria-hidden="true">-</span><button type="button" class="doc-title" title="Rename document" aria-label="Rename document"><span>research-notes.md</span><i data-lucide="pencil" class="ic"></i></button></div>
      <span class="save-state" data-state="dirty"><span class="dot" aria-hidden="true"></span><span id="saveStateText">Unsaved changes</span></span>
    </div>
    <div class="titlebar__search" role="search"><div class="search"><label class="search-lbl" aria-hidden="true"><i data-lucide="search" class="ic"></i></label><input type="search" placeholder="Search commands, files, headings" aria-label="Command search" aria-keyshortcuts="Control+K"><kbd aria-hidden="true">Ctrl K</kbd></div></div>
    <div class="titlebar__right" role="group" aria-label="Application">
      <button class="tbtn" data-act="theme" aria-label="Toggle theme" title="Toggle light / dark theme"><i data-lucide="moon" class="ic"></i></button>
      <button class="tbtn" data-act="toggle-right" aria-label="Toggle right sidebar" title="Toggle right sidebar"><i data-lucide="panel-right" class="ic"></i></button>
      <span class="tb-sep" role="separator"></span>
      <button class="tbtn" data-act="shortcuts" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"><i data-lucide="keyboard" class="ic"></i></button>
      <button class="tbtn" data-act="settings" aria-label="Preferences" title="Preferences"><i data-lucide="settings" class="ic"></i></button>
      <button class="tbtn" data-act="about" aria-label="About" title="About"><i data-lucide="circle-help" class="ic"></i></button>
      <div class="wc" id="winControls" role="group" aria-label="Window controls"><span class="tb-sep" role="separator"></span>
        <button type="button" class="tbtn wc__btn" data-wc="minimize" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8"/></svg></button>
        <button type="button" class="tbtn wc__btn" data-wc="maximize" data-maximized="false" aria-label="Maximize" title="Maximize"><svg class="wc__max" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.25" y="2.25" width="7.5" height="7.5" rx=".5"/></svg><svg class="wc__rest" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.25" y="3.75" width="6" height="6" rx=".5"/><path d="M4 3.75V2.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5H8.25"/></svg></button>
        <button type="button" class="tbtn wc__btn wc__btn--close" data-wc="close" aria-label="Close" title="Close"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </div>
  </header>
  <nav class="tabrow" aria-label="Ribbon"><div class="tablist" id="rtabs" role="tablist" aria-label="Ribbon tabs"></div></nav>
  <section class="ribbon" aria-label="Ribbon commands"><div class="ribbon__body" id="ribbon"></div></section>
  <main class="md-work">
    <aside class="md-side md-left" id="left" aria-label="Left sidebar"></aside><div class="md-grip" data-grip="left" aria-hidden="true"></div>
    <div class="md-groups" id="groups"><div class="md-group">
      <div class="md-tabs" id="doctabs"></div>
      <section class="md-editor" aria-label="Editor">
        <div class="md-seg" id="modeseg"></div>
        <div class="md-panes">
          <div class="md-src md-cm" id="src"></div>
          <article class="md-prev" id="prev" tabindex="0" aria-label="Preview"></article>
        </div>
      </section>
    </div></div>
    <div class="md-grip" data-grip="right" aria-hidden="true"></div><aside class="md-side md-right" id="right" aria-label="Right sidebar"></aside>
  </main>
  <footer class="md-status" id="status" aria-label="Status bar"></footer>
  <div class="md-backstage" id="backstage" hidden></div>
  <div class="md-studio" id="studio" hidden></div>
</div>
<div id="toasts" class="toasts" role="status" aria-live="polite" aria-relevant="additions"></div>
<script src="vendor/lucide.min.js"></script>
<script type="module" src="src/main.js"></script>
